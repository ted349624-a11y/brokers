html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one quiet screen. Wordmark + pill top, the broker centred, one action, a spots meter bottom-left. Steps replace the stage in place. */
:root{
  --bg:#000;
  --fg:#f2f1ef;
  --muted:#8a8986;
  --dim:#2a2a29;
  --pill:#f2f1ef;
  --pill-fg:#0b0b0b;
  --tie:#a51c1c;
  --serif:"DM Serif Display", Georgia, serif;
  --sans:"Manrope", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{min-height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:22px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:30px;letter-spacing:-.01em;line-height:1}
.mark img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 30%;image-rendering:pixelated}
.pill{appearance:none;border:0;border-radius:999px;background:var(--pill);color:var(--pill-fg);font-family:var(--sans);font-weight:600;font-size:16px;padding:14px 26px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .2s,opacity .2s;box-shadow:0 0 0 rgba(255,255,255,0)}
.pill:hover{box-shadow:0 0 40px rgba(255,255,255,.14)}
.pill:active{transform:scale(.98)}
.pill:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.pill.sm{padding:11px 20px;font-size:15px}
.pill.ghost{background:transparent;color:var(--fg);border:1px solid var(--dim)}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-block:28px}
.stage{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:22px;animation:in .45s ease both}
@keyframes in{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero-img{width:min(300px,70vw);aspect-ratio:1;max-width:100%;image-rendering:pixelated;-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 55%,transparent 72%);mask-image:radial-gradient(circle at 50% 45%,#000 55%,transparent 72%);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.cap{color:var(--muted);font-size:15px;margin:0;max-width:40ch}
.cta{min-width:min(300px,100%)}

.count{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dots{display:flex;gap:7px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dim);transition:background .3s}
.dots i.on{background:var(--fg)}
.task-ico{width:64px;height:64px;border-radius:50%;border:1px solid var(--dim);display:grid;place-items:center}
.task-ico svg{width:26px;height:26px;fill:none;stroke:var(--fg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(32px,6vw,42px);line-height:1.05;margin:0;text-wrap:balance}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.postlink{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere;max-width:100%}
.postlink:hover{color:var(--fg)}
.back{background:none;border:0;color:var(--muted);font-family:var(--sans);font-size:14px;cursor:pointer;padding:4px}
.back:hover{color:var(--fg)}

form{width:100%;display:flex;flex-direction:column;gap:12px;text-align:left}
.in{width:100%;background:transparent;border:1px solid var(--dim);border-radius:14px;color:var(--fg);font-family:var(--mono);font-size:14px;padding:15px 16px;transition:border-color .2s}
.in::placeholder{color:#5b5a57}
.in:focus{outline:none;border-color:var(--fg)}
.in.bad{border-color:var(--tie)}
.err{color:#e06464;font-size:13px;min-height:0;padding-left:4px}
.hint{color:var(--muted);font-size:13px;padding-left:4px}

.card-wrap{width:100%;max-width:560px}
canvas{width:100%;height:auto;border-radius:18px;display:block;box-shadow:0 30px 80px rgba(255,255,255,.06)}

footer{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;gap:10px}
.meter .n{font-size:15px}
.meter .n span{color:var(--muted);margin-left:10px}
.ticks{display:flex;gap:4px}
.ticks i{width:4px;height:20px;border-radius:2px;background:var(--dim)}
.ticks i.on{background:var(--fg)}
.fine{font-size:12.5px;color:#5b5a57;max-width:38ch;text-align:right}
@media (max-width:560px){.fine{text-align:left}.mark{font-size:26px}header .pill{padding:11px 18px;font-size:14px}}
@media (prefers-reduced-motion:reduce){.hero-img,.stage{animation:none}}
.alloc{display:flex;flex-direction:column;align-items:center;gap:4px}
.alloc .n{font-family:var(--serif);font-size:clamp(44px,11vw,68px);line-height:1;font-variant-numeric:tabular-nums}
.alloc .t{font-family:var(--mono);font-size:16px;color:#e05252;letter-spacing:.04em}
.math{font-family:var(--mono);font-size:13px;color:var(--muted)}
.addr{font-family:var(--mono);font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.or{font-size:12.5px;color:var(--muted)}
.small{font-size:12.5px;color:var(--muted);margin:0;max-width:44ch}
</style>
</head>

    <img class="hero-img" src="${LOGO}" alt="Elysium Broker: pixel broker in a black suit and red tie" style="width:min(200px,50vw)">
    <div class="count">$BROKER airdrop</div>
    <h2>Check your allocation</h2>
    <p class="cap">Every Broker NFT you hold = <b>500,000 $BROKER</b>.</p>
    ${eth?`<button class="pill cta" id="cn" type="button">Connect wallet</button><div class="or">or paste an address</div>`:""}
    <form id="f" novalidate>
      <input class="in" id="wa" placeholder="0x…" autocomplete="off" spellcheck="false" autocapitalize="off" aria-label="Wallet address">
      <div class="err" id="e">${msg?esc(msg):""}</div>
      <button class="pill${eth?" ghost":""}" id="sb" type="submit" style="margin-top:6px">Check</button>
    </form>
    <p class="small">Read-only. This page never asks you to sign or send anything.</p>
  </div>`;
  const c=document.getElementById("cn"); if(c) c.onclick=connect;
  document.getElementById("f").addEventListener("submit",e=>{
    e.preventDefault();
    const w=document.getElementById("wa").value.trim();
    if(!/^0x[a-fA-F0-9]{40}$/.test(w)){document.getElementById("wa").classList.add("bad");document.getElementById("e").textContent="Enter an EVM address: 0x + 40 characters.";return;}
    check(w);
  });
}

async function connect(){
  try{ const a=await eth.request({method:"eth_requestAccounts"}); if(a&&a[0]) check(a[0]); }catch(e){}
}
topB.onclick=()=>{ if(eth) connect(); else form(); };

async function check(w){
  main.innerHTML=`<div class="stage"><p class="cap">Checking ${esc(w.slice(0,6))}…${esc(w.slice(-4))}…</p></div>`;
  let j={};
  try{ j=await (await fetch("/api/claim?wallet="+encodeURIComponent(w))).json(); }catch(e){}
  if(!j.ok) return form(j.error==="rate"?"Too many checks. Wait a minute.":"Couldn't read the chain right now. Try again.");
  topB.textContent=w.slice(0,6)+"…"+w.slice(-4);
  main.innerHTML=`<div class="stage">
    <div class="count">Your allocation</div>
    <div class="alloc"><span class="n">${fmt(j.allocation)}</span><span class="t">$BROKER</span></div>
    <div class="math">${j.held} Broker × ${fmt(j.perNft)} $BROKER</div>
    <div class="addr">${esc(j.wallet)}</div>
    ${j.held>0
      ? `<button class="pill cta" type="button" disabled>Claim opens at $BROKER launch</button>
         <p class="small">Keep your Brokers in this wallet. The more you hold, the more you get.</p>`
      : `<p class="cap">No Broker NFTs in this wallet yet.</p>
         <a class="pill cta" href="${OPENSEA}" target="_blank" rel="noopener">Get a Broker on OpenSea</a>`}
    <button class="back" id="again" type="button">← Check another wallet</button>
  </div>`;
  document.getElementById("again").onclick=()=>form();
}

form();
if(eth) eth.request({method:"eth_accounts"}).then(a=>{ if(a&&a[0]) check(a[0]); }).catch(()=>{});
</script>

</body>
</html>
