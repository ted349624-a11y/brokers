name: Download Solana NFT images

on:
  workflow_dispatch:
    inputs:
      wallet:
        required: true
      match:
        default: liquid

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q solders
      - name: Download
        env:
          WALLET: ${{ inputs.wallet }}
          MATCH: ${{ inputs.match }}
        run: python3 tools/solana_nfts.py
      - name: Hand the files over on a temporary branch
        run: |
          du -sh out
          cd out
          git init -q -b tmp-nft-images
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "temporary: NFT images"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-nft-images
