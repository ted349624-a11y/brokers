name: Discord moderation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - discord/banned_words.txt
      - discord/automod.py

jobs:
  automod:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply AutoMod rules
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python3 discord/automod.py
