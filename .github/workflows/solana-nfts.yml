name: Download Solana NFT images

on:
  workflow_dispatch:
    inputs:
      wallet:
        description: Wallet address (or "cleanup" to delete the temporary branch)
        required: true
      match:
        default: liquid

permissions:
  contents: write

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup only
        if: inputs.wallet == 'cleanup'
        run: |
          git ls-remote --exit-code "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" refs/heads/tmp-nft-images \
            && git push "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" --delete tmp-nft-images || echo "nothing to delete"
          exit 0
      - uses: actions/checkout@v4
        if: inputs.wallet != 'cleanup'
      - uses: actions/setup-python@v5
        if: inputs.wallet != 'cleanup'
        with:
          python-version: "3.12"
      - run: pip install -q solders
        if: inputs.wallet != 'cleanup'
      - name: Download
        if: inputs.wallet != 'cleanup'
        env:
          WALLET: ${{ inputs.wallet }}
          MATCH: ${{ inputs.match }}
        run: python3 tools/solana_nfts.py
      - name: Hand the files over on a temporary branch
        if: inputs.wallet != 'cleanup'
        run: |
          du -sh out
          cd out
          git init -q -b tmp-nft-images
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "temporary: NFT images"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" tmp-nft-images
