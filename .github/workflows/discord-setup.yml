name: Discord server setup

on:
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up the Elysium Broker server
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          SITE_URL: https://www.elysiumbroker.xyz
        run: python3 discord/setup.py
