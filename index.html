html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: one quiet screen. Wordmark + pill top, the broker centred, one action, a spots meter bottom-left. Steps replace the stage in place. */
:root{
  --bg:#000;
  --fg:#f2f1ef;
  --muted:#8a8986;
  --dim:#2a2a29;
  --pill:#f2f1ef;
  --pill-fg:#0b0b0b;
  --tie:#a51c1c;
  --serif:"DM Serif Display", Georgia, serif;
  --sans:"Manrope", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{min-height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:22px 28px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.mark{display:flex;align-items:center;gap:12px;font-family:var(--serif);font-size:30px;letter-spacing:-.01em;line-height:1}
.mark img{width:34px;height:34px;border-radius:50%;object-fit:cover;object-position:50% 30%;image-rendering:pixelated}
.pill{appearance:none;border:0;border-radius:999px;background:var(--pill);color:var(--pill-fg);font-family:var(--sans);font-weight:600;font-size:16px;padding:14px 26px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .2s,opacity .2s;box-shadow:0 0 0 rgba(255,255,255,0)}
.pill:hover{box-shadow:0 0 40px rgba(255,255,255,.14)}
.pill:active{transform:scale(.98)}
.pill:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.pill.sm{padding:11px 20px;font-size:15px}
.pill.ghost{background:transparent;color:var(--fg);border:1px solid var(--dim)}
:focus-visible{outline:2px solid var(--fg);outline-offset:3px}

main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding-block:28px}
.stage{width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:22px;animation:in .45s ease both}
@keyframes in{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}
.hero-img{width:min(300px,70vw);aspect-ratio:1;max-width:100%;image-rendering:pixelated;-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 55%,transparent 72%);mask-image:radial-gradient(circle at 50% 45%,#000 55%,transparent 72%);animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.cap{color:var(--muted);font-size:15px;margin:0;max-width:40ch}
.cta{min-width:min(300px,100%)}

.count{font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.dots{display:flex;gap:7px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--dim);transition:background .3s}
.dots i.on{background:var(--fg)}
.task-ico{width:64px;height:64px;border-radius:50%;border:1px solid var(--dim);display:grid;place-items:center}
.task-ico svg{width:26px;height:26px;fill:none;stroke:var(--fg);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
h2{font-family:var(--serif);font-weight:400;font-size:clamp(32px,6vw,42px);line-height:1.05;margin:0;text-wrap:balance}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.postlink{font-family:var(--mono);font-size:12.5px;color:var(--muted);text-decoration:underline;text-underline-offset:3px;overflow-wrap:anywhere;max-width:100%}
.postlink:hover{color:var(--fg)}
.back{background:none;border:0;color:var(--muted);font-family:var(--sans);font-size:14px;cursor:pointer;padding:4px}
.back:hover{color:var(--fg)}

form{width:100%;display:flex;flex-direction:column;gap:12px;text-align:left}
.in{width:100%;background:transparent;border:1px solid var(--dim);border-radius:14px;color:var(--fg);font-family:var(--mono);font-size:14px;padding:15px 16px;transition:border-color .2s}
.in::placeholder{color:#5b5a57}
.in:focus{outline:none;border-color:var(--fg)}
.in.bad{border-color:var(--tie)}
.err{color:#e06464;font-size:13px;min-height:0;padding-left:4px}
.hint{color:var(--muted);font-size:13px;padding-left:4px}

.card-wrap{width:100%;max-width:560px}
canvas{width:100%;height:auto;border-radius:18px;display:block;box-shadow:0 30px 80px rgba(255,255,255,.06)}

footer{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.meter{display:flex;flex-direction:column;gap:10px}
.meter .n{font-size:15px}
.meter .n span{color:var(--muted);margin-left:10px}
.ticks{display:flex;gap:4px}
.ticks i{width:4px;height:20px;border-radius:2px;background:var(--dim)}
.ticks i.on{background:var(--fg)}
.fine{font-size:12.5px;color:#5b5a57;max-width:38ch;text-align:right}
@media (max-width:560px){.fine{text-align:left}.mark{font-size:26px}header .pill{padding:11px 18px;font-size:14px}}
@media (prefers-reduced-motion:reduce){.hero-img,.stage{animation:none}}
</style>

  like:'<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg>',
  rt:'<svg viewBox="0 0 24 24"><path d="M7 7h10v6"/><path d="M14 10l3 3 3-3"/><path d="M17 17H7v-6"/><path d="M10 14l-3-3-3 3"/></svg>',
  notif:'<svg viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  reply:'<svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg>'
};
const POST = "https://x.com/elysiumbroker/status/2118404106784276824";   // the whitelist post
const TASKS = [
  {id:"follow",t:"Follow @"+CONFIG.X_HANDLE,c:"Follow the broker on X to stay on the desk.",b:"Open profile",u:"https://x.com/"+CONFIG.X_HANDLE},
  {id:"like",t:"Like the post",c:"Open the post and tap the heart.",b:"Open post",post:1,u:POST},
  {id:"rt",t:"Repost",c:"Open the post and repost it.",b:"Open post",post:1,u:POST},
  {id:"notif",t:"Turn on notifications",c:"Open the profile and tap the bell so you don't miss the mint.",b:"Open profile",u:"https://x.com/"+CONFIG.X_HANDLE,confirm:"Bell is on"},
  {id:"reply",t:"Leave a comment",c:"Open the post and reply in your own words. Bot or copy-paste replies are removed.",b:"Open post",post:1,u:POST,confirm:"I commented"}
];

const S = {get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let st = S.get("eb2") || {step:-1, opened:{}};
const main = document.getElementById("main");
const save = ()=>S.set("eb2",st);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function go(step){st.step=step;save();view();}
document.getElementById("topBtn").onclick=()=>{ if(st.done) go(99); else go(Math.max(0,st.step)); };

function dots(active){return '<div class="dots">'+[0,1,2,3,4,5].map(i=>`<i class="${i<=active?"on":""}"></i>`).join("")+"</div>";}

function view(){
  const top=document.getElementById("topBtn");
  top.textContent = st.done ? "My pass" : "Apply whitelist";
  if(st.done && st.step!==-1) return card();
  if(st.step<0) return home();
  if(st.step<TASKS.length) return task(st.step);
  return details();
}

function home(){
  main.innerHTML=`<div class="stage">
    <img class="hero-img" src="${LOGO}" alt="Elysium Broker: pixel broker in a black suit and red tie">
    <button class="pill cta" id="go" type="button">${st.done?"View my pass":"Apply whitelist"}</button>
    ${st.done?'<p class="cap">You\'re on the list.</p>':""}</div>`;
  document.getElementById("go").onclick=()=>go(st.done?99:Math.max(0,st.step===-1?firstOpen():st.step));
}
function firstOpen(){const i=TASKS.findIndex(t=>!st.opened[t.id]);return i<0?TASKS.length:i;}

function task(i){
  const k=TASKS[i], opened=!!st.opened[k.id];
  main.innerHTML=`<div class="stage">
    ${dots(i)}
    <div class="count">Task ${i+1} of ${TASKS.length}</div>
    <div class="task-ico">${I[k.id]}</div>
    <h2>${esc(k.t)}</h2>
    <p class="cap">${esc(k.c)}</p>
    <div class="row">
      <a class="pill ${opened?"ghost":""} cta" id="open" href="${k.u}" target="_blank" rel="noopener">${esc(k.b)}</a>
    </div>
    ${k.post?`<a class="postlink" href="${POST}" target="_blank" rel="noopener">x.com/${esc(CONFIG.X_HANDLE)}/status/${esc(CONFIG.TWEET_ID)}</a>`:""}
    ${opened?`<button class="pill cta" id="next" type="button">${k.confirm?esc(k.confirm)+" · Continue":"Continue"}</button>`:`<p class="cap" style="font-size:13px">Continue unlocks after you open X.</p>`}
    ${i>0?'<button class="back" id="back" type="button">← Back</button>':""}
  </div>`;
  document.getElementById("open").addEventListener("click",()=>{ if(!st.opened[k.id]){st.opened[k.id]=true;save();setTimeout(()=>task(i),600);} });
  const n=document.getElementById("next"); if(n) n.onclick=()=>go(i+1);
  const b=document.getElementById("back"); if(b) b.onclick=()=>go(i-1);
}

const RX={xh:/^@?[A-Za-z0-9_]{1,15}$/,wa:/^0x[a-fA-F0-9]{40}$/,cl:/^https?:\/\/(www\.)?(x|twitter)\.com\/[A-Za-z0-9_]{1,15}\/status\/\d+/};
const MSG={xh:"Enter your X username.",wa:"Enter an EVM address: 0x + 40 characters.",cl:"Paste the link to your reply."};

function details(){
  const d=st.draft||{};
  main.innerHTML=`<div class="stage">
    ${dots(5)}
    <div class="count">Final step</div>
    <h2>Your details</h2>
    <form id="f" novalidate>
      <input class="in" id="xh" placeholder="X username" value="${esc(d.xh||"")}" autocomplete="off" spellcheck="false" aria-label="X username">
      <div class="err" id="e-xh"></div>
      <input class="in" id="wa" placeholder="Wallet address 0x…" value="${esc(d.wa||"")}" autocomplete="off" spellcheck="false" aria-label="Wallet address">
      <div class="err" id="e-wa"></div>
      <button class="pill" id="sb" type="submit" style="margin-top:6px">Apply whitelist</button>
    </form>
    <button class="back" id="back" type="button">← Back</button>
  </div>`;
  document.getElementById("back").onclick=()=>go(TASKS.length-1);
  ["xh","wa"].forEach(id=>document.getElementById(id).addEventListener("input",e=>{st.draft={...(st.draft||{}),[id]:e.target.value};save();}));
  document.getElementById("f").addEventListener("submit",submit);
}
function chk(id){const el=document.getElementById(id),ok=RX[id].test(el.value.trim());el.classList.toggle("bad",!ok);document.getElementById("e-"+id).textContent=ok?"":MSG[id];return ok;}

async function submit(e){
  e.preventDefault();
  if(!["xh","wa"].map(chk).every(Boolean)) return;
  const handle=document.getElementById("xh").value.trim().replace(/^@/,"");
  const wallet=document.getElementById("wa").value.trim();
  const sb=document.getElementById("sb"); sb.disabled=true; sb.textContent="Applying…";
  let no=null;
  if(CONFIG.SUBMIT_URL){
    try{
      const body=JSON.stringify({handle,wallet,tasks:TASKS.map(t=>t.id).join(",")});
      const cross=new URL(CONFIG.SUBMIT_URL,location.href).origin!==location.origin;
      let j;
      try{
        const r=await fetch(CONFIG.SUBMIT_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body});
        j=await r.json().catch(()=>({ok:false}));
      }catch(netErr){
        if(!cross) throw netErr;
        // served from another domain and the API doesn't send CORS yet: the entry is still saved,
        // we just can't read the reply, so issue the pass with a wallet-derived number
        j={ok:true};
      }
      if(!j.ok){
        sb.disabled=false; sb.textContent="Apply whitelist";
        document.getElementById("e-wa").textContent = j.error==="duplicate" ? "This wallet or X account is already on the list." : j.error==="rate" ? "Too many attempts. Wait a minute and try again." : j.error==="invalid" ? "Some details look wrong. Check them and try again." : "The whitelist is not accepting entries right now. Try again soon.";
        return;
      }
      no=j.n;
    }catch(err){
      sb.disabled=false; sb.textContent="Apply whitelist";
      document.getElementById("e-wa").textContent="Couldn't reach the server. Try again in a moment.";
      return;
    }
  }
  if(!no){let h=0;for(const c of wallet.toLowerCase())h=(h*31+c.charCodeAt(0))>>>0;no=(h%CONFIG.TOTAL_SPOTS)+1;}
  st.done={handle,wallet,no,ts:Date.now()}; st.step=99; save(); view();
}

/* ---------- personal pass ---------- */
function card(){
  const p=st.done;
  main.innerHTML=`<div class="stage" style="max-width:560px">
    <div class="count">Whitelist confirmed</div>
    <h2>Welcome to the desk, @${esc(p.handle)}</h2>
    <div class="card-wrap"><canvas id="cv" width="1200" height="675" aria-label="Your Elysium Broker whitelist pass"></canvas></div>
    <div class="row">
      <button class="pill sm" id="dl" type="button">Save card</button>
    </div>
    <p class="cap" id="dlmsg" style="font-size:13px">Every entry is checked by hand before the mint.</p>
  </div>`;
  draw(p);
  document.getElementById("dl").onclick=()=>{
    const cv=document.getElementById("cv");
    try{
      const a=document.createElement("a");a.download=`elysium-broker-pass-${p.handle}.png`;a.href=cv.toDataURL("image/png");document.body.appendChild(a);a.click();a.remove();
      document.getElementById("dlmsg").textContent="If nothing downloaded, long-press the card to save it.";
    }catch(e){document.getElementById("dlmsg").textContent="Long-press or right-click the card to save it.";}
  };
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function draw(p){
  const cv=document.getElementById("cv"),c=cv.getContext("2d"),W=1200,H=675;
  const img=new Image();
  img.onload=async()=>{
    try{await document.fonts.load('64px "DM Serif Display"');await document.fonts.load('600 20px "Manrope"');await document.fonts.load('22px "JetBrains Mono"');}catch(e){}
    c.clearRect(0,0,W,H);
    rr(c,0,0,W,H,36);c.save();c.clip();
    // ground
    const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,"#151515");g.addColorStop(1,"#050505");c.fillStyle=g;c.fillRect(0,0,W,H);
    // pixel grid texture
    c.fillStyle="rgba(255,255,255,.025)";for(let x=0;x<W;x+=24)for(let y=0;y<H;y+=24)if(((x+y)/24)%2===0)c.fillRect(x,y,24,24);
    // portrait panel
    c.save();rr(c,48,48,420,579,24);c.clip();c.drawImage(img,48-80,48,579,579);
    const sh=c.createLinearGradient(0,400,0,627);sh.addColorStop(0,"rgba(0,0,0,0)");sh.addColorStop(1,"rgba(0,0,0,.85)");c.fillStyle=sh;c.fillRect(48,400,420,227);c.restore();
    c.strokeStyle="rgba(255,255,255,.12)";c.lineWidth=2;rr(c,48,48,420,579,24);c.stroke();
    // tie stripe
    c.fillStyle="#a51c1c";c.fillRect(W-64,0,16,H);
    // text
    const L=530;
    c.fillStyle="#8a8986";c.font='500 20px "JetBrains Mono", monospace';c.fillText("WHITELIST PASS",L,104);
    c.fillStyle="#f2f1ef";c.font='72px "DM Serif Display", Georgia, serif';c.fillText("Elysium Broker",L,186);
    c.fillStyle="#a51c1c";c.font='500 22px "JetBrains Mono", monospace';c.fillText("No. "+String(p.no).padStart(4,"0"),L,232);
    c.fillStyle="rgba(255,255,255,.1)";c.fillRect(L,280,560,1);
    const field=(lab,val,y)=>{c.fillStyle="#8a8986";c.font='600 17px "Manrope", sans-serif';c.fillText(lab,L,y);c.fillStyle="#f2f1ef";c.font='500 30px "JetBrains Mono", monospace';c.fillText(val,L,y+42);};
    let h="@"+p.handle;
    field("HOLDER",h,334);
    field("WALLET",p.wallet.slice(0,8)+"…"+p.wallet.slice(-6),432);
    field("ISSUED",new Date(p.ts).toLocaleDateString("en-GB",{day:"2-digit",month:"short",year:"numeric"}).toUpperCase(),530);
    c.fillStyle="#5b5a57";c.font='500 16px "JetBrains Mono", monospace';c.fillText("ELYSIUM L2 · HYPE GAS · 100MS",L,622);
    c.restore();
  };
  img.src=LOGO;
}

/* ---------- spots meter ---------- */
function meter(taken){
  const total=CONFIG.TOTAL_SPOTS, rem=Math.max(0,total-taken), N=30, on=Math.round(rem/total*N);
  document.getElementById("remN").innerHTML=rem.toLocaleString()+"<span>remaining</span>";
  document.getElementById("ticks").innerHTML=Array.from({length:N},(_,i)=>`<i class="${i<on?"on":""}"></i>`).join("");
  document.getElementById("meter").hidden=false;
}
async function loadCount(){
  if(!CONFIG.SUBMIT_URL){meter(0);return;}
  try{const r=await fetch(CONFIG.SUBMIT_URL);const j=await r.json();meter(j.count||0);}catch(e){meter(0);}
}
view();
</script>
