name: Discord permissions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - discord/permissions.py

jobs:
  permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply channel write permissions
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python3 discord/permissions.py
