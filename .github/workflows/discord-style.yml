name: Discord style

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - discord/style.py

jobs:
  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rename channels with emojis
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: python3 discord/style.py
